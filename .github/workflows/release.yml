name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: jidoka-linux-x86_64
            executable: target/release/jidoka
          - os: windows-latest
            artifact: jidoka-windows-x86_64.exe
            executable: target/x86_64-pc-windows-msvc/release/jidoka.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - run: cargo test --locked
      - name: Build Linux release
        if: runner.os != 'Windows'
        run: cargo build --release --locked
        env:
          JIDOKA_RELEASE: '1'
      - name: Build Windows release with static CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-release.ps1
      - name: Inspect and smoke-test Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-release.ps1 -Executable '${{ matrix.executable }}'
      - name: Smoke-test Linux release
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          & './${{ matrix.executable }}' --version
          if ($LASTEXITCODE -ne 0) { throw "Release executable failed with exit code $LASTEXITCODE" }
      - shell: pwsh
        run: Copy-Item '${{ matrix.executable }}' '${{ matrix.artifact }}'
      - shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 '${{ matrix.artifact }}').Hash.ToLowerInvariant() | Set-Content -Encoding ascii '${{ matrix.artifact }}.sha256'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: jidoka-*
          merge-multiple: true
          path: dist
      - name: Read release version
        id: version
        run: echo "tag=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jidoka") | .version')" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/master || { echo 'Release from master only' >&2; exit 1; }
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo 'Version tag already exists; investigate before releasing.' >&2
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo 'Could not check release tags.' >&2
            exit "$status"
          fi
          gh release create '${{ steps.version.outputs.tag }}' --target "$GITHUB_SHA" dist/* scripts/install.sh scripts/install.ps1 --generate-notes
