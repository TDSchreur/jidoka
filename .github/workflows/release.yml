name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: factory-linux-x86_64
            executable: target/release/factory
          - os: windows-latest
            artifact: factory-windows-x86_64.exe
            executable: target/release/factory.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - shell: pwsh
        run: |
          Copy-Item '${{ matrix.executable }}' '${{ matrix.artifact }}'
          (Get-FileHash -Algorithm SHA256 '${{ matrix.artifact }}').Hash.ToLowerInvariant() | Set-Content -Encoding ascii '${{ matrix.artifact }}.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: factory-*
          merge-multiple: true
          path: dist
      - name: Read release version
        id: version
        run: echo "tag=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "factory") | .version')" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/master || { echo 'Release from master only' >&2; exit 1; }
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo 'Version tag already exists; investigate before releasing.' >&2
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo 'Could not check release tags.' >&2
            exit "$status"
          fi
          gh release create '${{ steps.version.outputs.tag }}' --target "$GITHUB_SHA" dist/* scripts/install.sh scripts/install.ps1 --generate-notes
