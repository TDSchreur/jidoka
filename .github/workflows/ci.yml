name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Restores the compiled dependencies. The key covers the OS, the Rust version and the Cargo manifests
      # including Cargo.lock, so a changed dependency or compiler starts a fresh cache, and the checks below
      # still run in full. Only runs on develop save a cache; pull requests read it but never write one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # Keep these checks in sync with scripts/verify.sh.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Uses the Chrome or Chromium preinstalled on ubuntu-latest; the test looks it up on PATH.
      - name: Test the dashboard help in a browser
        if: runner.os == 'Linux'
        run: python3 tests/dashboard-help.py
      - name: Build and inspect Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-windows-release.ps1 -Executable './target/x86_64-pc-windows-msvc/release/factory.exe'
      - name: Test Windows installer in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-installer-integration.ps1 -Executable './target/x86_64-pc-windows-msvc/release/factory.exe'
      - name: Test Windows installer in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-installer-integration.ps1 -Executable './target/x86_64-pc-windows-msvc/release/factory.exe'
      - name: Test Windows installer failures on Linux
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tests/windows-installer-startup.ps1
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
  ci-ok:
    if: always()
    needs: [check, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          RESULT: ${{ needs.check.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: test "$RESULT" = success && test "$ACTIONLINT_RESULT" = success
