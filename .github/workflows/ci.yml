name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pull request changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.paths.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed files
        id: paths
        shell: bash
        run: |
          git rev-parse --verify HEAD^2 >/dev/null
          # Use the base branch's classifier. Run full CI until it exists on the base.
          if git cat-file -e HEAD^1:scripts/classify-ci.py 2>/dev/null; then
            mode=$(git show HEAD^1:scripts/classify-ci.py | python3 -I -)
          else
            mode=full
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'CI path: %s\n' "$mode"
  check:
    needs: classify
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
        (needs.classify.result == 'success' &&
          (needs.classify.outputs.mode == 'full' || needs.classify.outputs.mode == 'content'))) }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: ${{ fromJSON(needs.classify.outputs.mode == 'content' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Line tables are enough for test backtraces; full debug info makes Windows (PDB) builds much slower.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Restores the compiled dependencies. The key covers the OS, the Rust version and the Cargo manifests
      # including Cargo.lock, so a changed dependency or compiler starts a fresh cache, and the checks below
      # still run in full. Only runs on develop save a cache; pull requests read it but never write one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # Keep these checks in sync with scripts/verify.sh.
      - if: needs.classify.outputs.mode != 'content'
        run: cargo fmt --check
      # Clippy runs on Linux only: the code is shared, and Windows-only lint gaps are accepted to save time.
      - name: Clippy
        if: runner.os == 'Linux' && needs.classify.outputs.mode != 'content'
        run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Uses the Chrome or Chromium preinstalled on ubuntu-latest; the tests look it up on PATH.
      # Runs the harness self-test (tests/test_*.py), then every tests/dashboard-*.py in name order, as scripts/verify.sh does.
      - name: Test the dashboard in a browser
        if: runner.os == 'Linux' && needs.classify.outputs.mode != 'content'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          for test in tests/dashboard-*.py; do
            python3 "$test"
          done
      # The Windows release build and installer tests run on pushes to develop and master, not on pull requests.
      # release.yml also builds and smoke-tests the release on master.
      - name: Build and inspect Windows release
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ./scripts/build-windows-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-windows-release.ps1 -Executable './target/x86_64-pc-windows-msvc/release/jidoka.exe'
      - name: Test Windows installer in Windows PowerShell 5.1
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: powershell
        run: ./tests/windows-installer-integration.ps1 -Executable './target/x86_64-pc-windows-msvc/release/jidoka.exe'
      - name: Test Windows installer in PowerShell 7
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: ./tests/windows-installer-integration.ps1 -Executable './target/x86_64-pc-windows-msvc/release/jidoka.exe'
      - name: Test Windows installer failures on Linux
        if: runner.os == 'Linux' && needs.classify.outputs.mode != 'content'
        shell: pwsh
        run: ./tests/windows-installer-startup.ps1
  actionlint:
    needs: classify
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
        (needs.classify.result == 'success' && needs.classify.outputs.mode == 'full')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
  ci-ok:
    if: always()
    needs: [classify, check, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks for the selected CI path
        env:
          # Allowed combinations are mode:check result:actionlint result.
          CI_PASSED: >-
            ${{ (github.event_name == 'push' || needs.classify.result == 'success') &&
              contains(fromJSON('["docs:skipped:skipped", "content:success:skipped", "full:success:success"]'),
                format('{0}:{1}:{2}', github.event_name == 'push' && 'full' || needs.classify.outputs.mode,
                  needs.check.result, needs.actionlint.result)) }}
        run: test "$CI_PASSED" = true
