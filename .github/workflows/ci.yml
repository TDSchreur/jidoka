name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Restores the compiled dependencies. The key covers the OS, the toolchain and Cargo.lock, so a
      # changed dependency or compiler starts a fresh cache, and the checks below still run in full.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Keep these three checks in sync with scripts/verify.sh.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  ci-ok:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
