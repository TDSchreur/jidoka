name: Bug report
description: Something in Jidoka does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or clicks that trigger it.
  - type: input
    id: version
    attributes:
      label: Jidoka version
      description: Output of `jidoka --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux x86-64, Windows x86-64, Other]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      options: [Claude Code, Codex, GitHub Copilot, Not applicable]
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant output, for example from `jidoka doctor`. Remove secrets first.
      render: text
