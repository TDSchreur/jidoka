[package]
name = "jidoka"
version = "0.14.1"
edition = "2024"
description = "Jidoka — the AI software factory"
license = "MIT"

[[bin]]
name = "jidoka"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5.2", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
percent-encoding = "2"
getrandom = "0.4.3"
time = { version = "0.3", features = ["parsing"] }
sha2 = "0.11.1"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
missing_panics_doc = "warn"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
