[package]
name = "factory"
version = "0.6.0"
edition = "2021"
description = "A small software factory"

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5.2", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"
