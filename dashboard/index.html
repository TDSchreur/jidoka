<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jidoka</title>
  <meta name="session-token" content="__TOKEN__">
  <meta name="server-pid" content="__PID__">
  <script>
    // Apply a stored theme choice before first paint to avoid a flash.
    try {
      const stored = localStorage.getItem('theme');
      if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
    } catch { /* storage unavailable: follow the system setting */ }
  </script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="importmap">
    {
      "imports": {
        "preact": "/assets/vendor/preact.js",
        "preact/hooks": "/assets/vendor/hooks.js",
        "htm": "/assets/vendor/htm.js"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <h1>
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <defs><linearGradient id="jidoka-logo-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F8CFF" /><stop offset="1" stop-color="#0A6CE0" /></linearGradient></defs>
        <path d="M39.88 22.05A16 16 0 1 1 25.95 8.12" fill="none" stroke="url(#jidoka-logo-blue)" stroke-width="7" stroke-linecap="round" />
        <circle cx="35.31" cy="12.69" r="4.6" fill="#F2B705" />
      </svg>
      <span class="wordmark">Jidoka</span>
    </h1>
    <p class="tagline">Define, build, check, finish: from idea to pull request.</p>
  </header>
  <div id="app"></div>
  <footer>
    <p class="build">Version <code>__BUILD__</code></p>
    <div id="theme-switch"></div>
  </footer>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
