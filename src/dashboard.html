<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDS Factory</title>
  <script>
    // Apply a stored theme choice before first paint to avoid a flash.
    try {
      const stored = localStorage.getItem('theme');
      if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
    } catch { /* storage unavailable: follow the system setting */ }
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fa; --text: #18243a; --eyebrow: #4a5c96; --muted: #44506a; --muted-soft: #536078;
      --surface: #ffffff; --border: #c9d1e0; --control-border: #6b7893;
      --danger: #8a1c1c; --link: #1d4ed8; --focus: #1d4ed8;
      --badge-bg: #edf0f7; --badge-border: #44506a;
      --blocked-bg: #8a1c1c; --blocked-text: #ffffff;
      --done-bg: #e3f4e8; --done-text: #14532d;
    }
    :root[data-theme="light"] { color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1626; --text: #e6ebf5; --eyebrow: #9db0e8; --muted: #b9c3d8; --muted-soft: #aab5cc;
        --surface: #182138; --border: #3b4766; --control-border: #8190ae;
        --danger: #ff9b9b; --link: #8ab4ff; --focus: #8ab4ff;
        --badge-bg: #222c46; --badge-border: #aab5cc;
        --blocked-bg: #ffb4b4; --blocked-text: #3b0a0a;
        --done-bg: #123524; --done-text: #8be0a8;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1626; --text: #e6ebf5; --eyebrow: #9db0e8; --muted: #b9c3d8; --muted-soft: #aab5cc;
      --surface: #182138; --border: #3b4766; --control-border: #8190ae;
      --danger: #ff9b9b; --link: #8ab4ff; --focus: #8ab4ff;
      --badge-bg: #222c46; --badge-border: #aab5cc;
      --blocked-bg: #ffb4b4; --blocked-text: #3b0a0a;
      --done-bg: #123524; --done-text: #8be0a8;
    }
    :root { font-family: system-ui, sans-serif; color: var(--text); background: var(--bg); }
    body { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }
    header { margin-bottom: 2rem; }
    .eyebrow { color: var(--eyebrow); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: .4rem 0; }
    p { color: var(--muted); line-height: 1.6; }
    .theme { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; margin: 0 0 1.5rem; padding: 0; border: 0; font-size: .9rem; }
    .theme legend { float: left; padding: 0; margin-right: .5rem; color: var(--muted); }
    .theme label { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .7rem; border: 1px solid var(--control-border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; }
    .theme label:has(input:checked) { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); font-weight: 700; }
    .theme label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
    .theme input { accent-color: var(--focus); margin: 0; }
    #message { margin: 0 0 1rem; }
    #message:empty { margin: 0; }
    #message.error { color: var(--danger); font-weight: 600; }
    .group { margin-bottom: 2rem; }
    .group h2 { font-size: 1.2rem; margin: 0; }
    .count { color: var(--muted); font-weight: 400; }
    .group-description { font-size: .85rem; margin: .1rem 0 .75rem; color: var(--muted-soft); }
    .empty { margin: 0; font-style: italic; }
    .runs { display: grid; gap: .75rem; list-style: none; margin: 0; padding: 0; }
    .run { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .run.blocked { border-left: 6px solid var(--danger); }
    .run h3 { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
    .run p { margin: .3rem 0 0; overflow-wrap: anywhere; }
    .project, .updated { font-size: .9rem; }
    .badge { display: inline-block; margin-top: .4rem; padding: .1rem .5rem; border: 1px solid var(--badge-border); border-radius: 4px; font-size: .8rem; font-weight: 700; color: var(--text); background: var(--badge-bg); text-transform: uppercase; letter-spacing: .04em; }
    .badge.blocked { color: var(--blocked-text); background: var(--blocked-bg); border-color: var(--blocked-bg); }
    .badge.done { color: var(--done-text); background: var(--done-bg); border-color: var(--done-text); }
    .rework { font-weight: 600; }
    .reason { color: var(--danger); font-weight: 600; }
    a { color: var(--link); }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">TDS Factory</div>
    <h1>Factory dashboard</h1>
    <p>A simple flow from an idea to a pull request.</p>
  </header>
  <fieldset class="theme">
    <legend>Theme</legend>
    <label><input type="radio" name="theme" value="system" checked> System</label>
    <label><input type="radio" name="theme" value="light"> Light</label>
    <label><input type="radio" name="theme" value="dark"> Dark</label>
  </fieldset>
  <main>
    <p id="message" role="status">Loading runs…</p>
    <div id="groups"></div>
  </main>
<script>
  const groupsEl = document.querySelector('#groups');
  const message = document.querySelector('#message');
  const GROUPS = [
    ['define', 'Define', 'Clarify the work, write a spec and create tickets.'],
    ['build', 'Build', 'Implement the spec and run the relevant checks.'],
    ['check', 'Check', 'Review the code and scan for security issues.'],
    ['finish', 'Finish', 'Create a pull request for the completed work.'],
    ['done', 'Done', 'Runs that have finished, whatever their stage.'],
  ];
  const STATUSES = ['running', 'blocked', 'done'];
  const REWORK_CAP = 2;
  let lastJson = null;

  const themeInputs = document.querySelectorAll('input[name="theme"]');
  function applyTheme(choice) {
    if (choice === 'light' || choice === 'dark') document.documentElement.dataset.theme = choice;
    else delete document.documentElement.dataset.theme;
  }
  try {
    const stored = localStorage.getItem('theme');
    for (const input of themeInputs) input.checked = input.value === (stored === 'light' || stored === 'dark' ? stored : 'system');
  } catch { /* storage unavailable: keep System selected */ }
  for (const input of themeInputs) {
    input.addEventListener('change', () => {
      applyTheme(input.value);
      try {
        if (input.value === 'system') localStorage.removeItem('theme');
        else localStorage.setItem('theme', input.value);
      } catch { /* the choice still applies for this visit */ }
    });
  }

  const el = (tag, text, className) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  };
  const timestamp = run => (typeof run.updated_at === 'number' && Number.isFinite(run.updated_at)
    && !Number.isNaN(new Date(run.updated_at).getTime())) ? run.updated_at : null;
  const groupOf = run => run.status === 'done' ? 'done' : run.stage;

  function compare(a, b) {
    const blocked = (b.run.status === 'blocked') - (a.run.status === 'blocked');
    if (blocked) return blocked;
    const ta = timestamp(a.run), tb = timestamp(b.run);
    if (ta !== null && tb !== null && ta !== tb) return tb - ta;
    if ((ta === null) !== (tb === null)) return ta === null ? 1 : -1;
    return b.index - a.index;
  }

  function ticket(value) {
    const p = el('p', undefined, 'ticket');
    p.append('Ticket: ');
    let url = null;
    try {
      const parsed = new URL(value);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') url = parsed;
    } catch { /* not a URL: show as text */ }
    if (url) {
      const a = el('a', value);
      a.href = url.href;
      a.rel = 'noopener noreferrer';
      p.append(a);
    } else {
      p.append(value);
    }
    return p;
  }

  function rework(count) {
    const text = count <= REWORK_CAP ? `${count} of ${REWORK_CAP}` : `${count} (past the cap of ${REWORK_CAP})`;
    return el('p', 'Rework ' + text, 'rework');
  }

  function card(run) {
    const item = el('li');
    const article = el('article', undefined, run.status === 'blocked' ? 'run blocked' : 'run');
    article.append(el('h3', run.title), el('p', run.project, 'project'));
    const status = STATUSES.includes(run.status) ? run.status : String(run.status);
    article.append(el('span', status, `badge ${STATUSES.includes(run.status) ? run.status : ''}`.trim()));
    if (Number.isInteger(run.rework) && run.rework > 0) article.append(rework(run.rework));
    if (run.activity) article.append(el('p', `Activity: ${run.activity}`, 'activity'));
    if (run.current_ticket) article.append(ticket(String(run.current_ticket)));
    if (run.blocking_reason) article.append(el('p', `Blocked: ${run.blocking_reason}`, 'reason'));
    const updated = el('p', undefined, 'updated');
    const ts = timestamp(run);
    if (ts !== null) {
      const date = new Date(ts);
      updated.append('Last updated ');
      const time = el('time', date.toLocaleString());
      time.dateTime = date.toISOString();
      updated.append(time);
    } else {
      updated.textContent = 'Last updated: not reported';
    }
    article.append(updated);
    item.append(article);
    return item;
  }

  function render(data) {
    const sections = GROUPS.map(([key, name, description]) => {
      const entries = data.map((run, index) => ({ run, index })).filter(e => groupOf(e.run) === key).sort(compare);
      const section = el('section', undefined, 'group');
      const heading = el('h2', name);
      heading.id = `group-${key}`;
      heading.append(el('span', ` (${entries.length})`, 'count'));
      section.setAttribute('aria-labelledby', heading.id);
      section.append(heading, el('p', description, 'group-description'));
      if (entries.length) {
        const list = el('ul', undefined, 'runs');
        list.append(...entries.map(e => card(e.run)));
        section.append(list);
      } else {
        section.append(el('p', 'No runs', 'empty'));
      }
      return section;
    });
    groupsEl.replaceChildren(...sections);
  }

  async function refresh() {
    try {
      const response = await fetch('/api/runs', { cache: 'no-store' });
      if (!response.ok) throw new Error('Failed to load runs');
      const data = await response.json();
      if (!Array.isArray(data)) throw new Error('Unexpected response');
      const json = JSON.stringify(data);
      if (json !== lastJson) {
        render(data);
        lastJson = json;
      }
      message.className = '';
      const text = data.length ? '' : 'No runs yet. Start one with the factory skill.';
      if (message.textContent !== text) message.textContent = text;
    } catch {
      message.className = 'error';
      message.textContent = 'Unable to load runs. Check that the factory server is running.';
    }
  }
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
